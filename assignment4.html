
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment #4 - Simple Payroll</title>
<link rel="stylesheet" href="style.css">
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6f4;
    color: #24332c;
}

header, footer {
    background: #205f49;
    color: white;
    text-align: center;
    padding: 20px;
}

nav {
    background: #174936;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 8px;
}

main {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
}

button {
    background: #205f49;
    color: white;
    border: none;
    padding: 12px 18px;
    cursor: pointer;
    margin-top: 12px;
}

.danger {
    background: #b83b3b;
}

.result {
    background: #e8f2ed;
    padding: 12px;
    margin-top: 15px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #205f49;
    color: white;
}

@media(max-width:600px) {
    nav a { display: inline-block; }
}
</style>
</head>

<body>

<header>
    <h1>Assignment #4 - Simple Payroll</h1>
    <p>ITC Assignments</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="assignment1.html">Assignment #1</a>
    <a href="assignment2.html">Assignment #2</a>
    <a href="assignment3.html">Assignment #3</a>
    <a href="assignment4.html">Assignment #4</a>
</nav>

<main>

<div class="card">

    <h2>Employee Information</h2>

    <div class="grid">

        <div>
            <label>Employee Name</label>
            <input type="text" id="empName" placeholder="Employee name">
        </div>

        <div>
            <label>Days Worked</label>
            <input type="number" id="days" min="0" step="1" placeholder="Days worked">
        </div>

        <div>
            <label>Daily Rate (₱)</label>
            <input type="number" id="rate" min="0" step="0.01" placeholder="Daily rate">
        </div>

        <div>
            <label>Deduction Amount (₱)</label>
            <input type="number" id="deduct" min="0" step="0.01" placeholder="Deduction">
        </div>

    </div>

    <button onclick="addEmployee()">Add Employee</button>

    <button class="danger" onclick="deleteEmployee()">
        Delete Employee
    </button>

    <div class="result" id="payMessage">
        Payroll messages will appear here.
    </div>

</div>


<div class="card">

    <h2>Payroll List</h2>

    <div class="table-wrap">

    <table>

        <thead>
            <tr>
                <th>No.</th>
                <th>Employee Name</th>
                <th>Days Worked</th>
                <th>Daily Rate</th>
                <th>Gross Pay</th>
                <th>Deduction Amount</th>
                <th>Net Pay</th>
            </tr>
        </thead>

        <tbody id="payBody">
            <tr>
                <td colspan="7">No employees added yet.</td>
            </tr>
        </tbody>

    </table>

    </div>

</div>

</main>

<footer>ITC Assignments</footer>

<script>

const employees = [];

function peso(n) {
    return "₱" + n.toLocaleString("en-PH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function addEmployee() {

    const name = document.getElementById("empName").value.trim();

    const dr = document.getElementById("days").value;
    const rr = document.getElementById("rate").value;
    const dd = document.getElementById("deduct").value;

    const days = Number(dr);
    const rate = Number(rr);
    const deduction = Number(dd);

    const msg = document.getElementById("payMessage");

    if (
        !name ||
        dr === "" ||
        rr === "" ||
        dd === "" ||
        !Number.isInteger(days) ||
        days < 0 ||
        !Number.isFinite(rate) ||
        rate < 0 ||
        !Number.isFinite(deduction) ||
        deduction < 0
    ) {
        msg.textContent =
            "Complete all fields with valid non-negative values. Days worked must be a whole number.";
        return;
    }

    let gross = days * rate;
    let net = gross - deduction;

    if (deduction > gross) {
        msg.textContent = "Deduction cannot be greater than gross pay.";
        return;
    }

    employees.push({
        name,
        days,
        rate,
        gross,
        deduction,
        net
    });

    renderPayroll();

    msg.textContent = name + " was added successfully.";

    document.getElementById("empName").value = "";
    document.getElementById("days").value = "";
    document.getElementById("rate").value = "";
    document.getElementById("deduct").value = "";
}


function renderPayroll() {

    const body = document.getElementById("payBody");

    body.innerHTML = "";

    if (employees.length === 0) {
        body.innerHTML =
            '<tr><td colspan="7">No employees added yet.</td></tr>';
        return;
    }

    employees.forEach((e, i) => {

        const row = body.insertRow();

        [
            i + 1,
            e.name,
            e.days,
            peso(e.rate),
            peso(e.gross),
            peso(e.deduction),
            peso(e.net)
        ].forEach(value => {

            row.insertCell().textContent = value;

        });

    });

}


function deleteEmployee() {

    const msg = document.getElementById("payMessage");

    if (employees.length === 0) {
        msg.textContent = "There are no employees to delete.";
        return;
    }

    const answer = prompt(
        "Enter the employee line number to delete:"
    );

    if (answer === null) {
        return;
    }

    const line = Number(answer);

    if (
        !Number.isInteger(line) ||
        line < 1 ||
        line > employees.length
    ) {
        msg.textContent =
            "Invalid line number. Check the No. column and try again.";
        return;
    }

    const removed = employees.splice(line - 1, 1)[0];

    renderPayroll();

    msg.textContent =
        removed.name + " was deleted. Line numbers have been updated.";

}

</script>

</body>
</html>
